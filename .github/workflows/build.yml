name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APKs
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk release-artifacts/sazgan-wiki-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/sazgan-wiki-release.apk

      - name: Upload Debug APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sazgan-wiki-debug-apk
          path: release-artifacts/sazgan-wiki-debug.apk

      - name: Upload Release APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sazgan-wiki-release-apk
          path: release-artifacts/sazgan-wiki-release.apk

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ویکی سازگان نسخه ${{ steps.version.outputs.version }}
          body: |
            ## ویکی سازگان — نسخه ${{ steps.version.outputs.version }}
            
            اپلیکیشن راهنمای دستگاه‌های پزشکی شرکت سازگان.
            
            ### 📥 دانلود
            - `sazgan-wiki-release.apk` — نسخه نهایی (پیشنهاد می‌شود)
            - `sazgan-wiki-debug.apk` — نسخه دیباگ
          files: |
            release-artifacts/sazgan-wiki-release.apk
            release-artifacts/sazgan-wiki-debug.apk
          draft: false
          prerelease: false
